# Topic weights drive ranking. Edit freely.

topics:
  # Priority 8 — at least 80% of the brief comes from these.
  ai: 1.00
  economics: 1.00
  markets: 0.98
  politics: 0.95
  business: 0.95
  technology: 0.95
  startups: 0.90
  world: 0.85
  # Diversity 2 — kept to ensure breadth, capped at ~20% of brief.
  science: 0.65
  opinion: 0.60

priority_topics:
  - ai
  - economics
  - markets
  - politics
  - business
  - technology
  - startups
  - world

# Selection cap: priority topics fill no more than this fraction of the brief.
# The remainder is reserved for science/opinion to keep the brief from becoming
# an echo chamber on your top interests. Range 0.0–1.0.
priority_cap: 0.80

# Keywords boost scoring when found in headline/summary.
boost_keywords:
  - federal reserve
  - interest rates
  - inflation
  - semiconductor
  - nvidia
  - openai
  - anthropic
  - chip
  - gpu
  - llm
  - foundation model
  - venture capital
  - ipo
  - antitrust
  - regulation
  - geopolitics
  - china
  - taiwan
  - europe
  - earnings
  - tariff
  - sanctions

# Negative keywords reduce scoring (or filter out entirely if score drops below threshold).
exclude_keywords:
  - horoscope
  - celebrity gossip
  - reality tv

# Output volume.
brief:
  deep_dives: 5         # full multi-source 10–15min synthesized pieces
  short_summaries: 10   # ~150-word skim summaries
  headlines_only: 10    # title + source + link, for the bottom skim list
