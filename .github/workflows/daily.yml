name: Daily Brief

on:
  schedule:
    # Multiple cron times in the 7am PT window for resilience.
    # GitHub Actions sometimes skips/delays scheduled runs (especially on new repos).
    # The sentinel below ensures only one delivery happens per PT calendar day.
    - cron: "0 14 * * *"   # 7:00 PDT
    - cron: "15 14 * * *"  # 7:15 PDT
    - cron: "30 14 * * *"  # 7:30 PDT
    - cron: "0 15 * * *"   # 7:00 PST (winter)
    - cron: "15 15 * * *"  # 7:15 PST
    - cron: "30 15 * * *"  # 7:30 PST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no Claude calls, no delivery)"
        required: false
        default: "false"

permissions:
  contents: write   # so we can commit dedup state + GH Pages
  pages: write
  id-token: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10  # need recent history to check bot's last commit

      - name: Decide whether to run
        id: dst
        env:
          TZ: America/Los_Angeles
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger — running."
            echo "should_run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          local_hour=$(TZ=America/Los_Angeles date +%H)
          echo "Local PT hour: $local_hour"
          if [ "$local_hour" != "07" ]; then
            echo "Not 7am PT — skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Skip if a successful delivery already happened today (PT calendar day).
          # We detect a delivery by the daily-brief-bot's commit pushing dedup state.
          today_pt=$(TZ=America/Los_Angeles date +%Y-%m-%d)
          last_bot_commit=$(git log --author="daily-brief-bot" --format="%aI" -1 2>/dev/null || echo "")
          if [ -n "$last_bot_commit" ]; then
            last_bot_pt=$(TZ=America/Los_Angeles date -d "$last_bot_commit" +%Y-%m-%d)
            echo "Last bot commit PT date: $last_bot_pt; today PT: $today_pt"
            if [ "$today_pt" = "$last_bot_pt" ]; then
              echo "Already delivered today — skipping."
              echo "should_run=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi

          echo "Will run."
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.dst.outputs.should_run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.dst.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run daily brief
        if: steps.dst.outputs.should_run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-4-6' }}
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ vars.RESEND_FROM || 'Daily Brief <onboarding@resend.dev>' }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TIMEZONE: America/Los_Angeles
          DEEP_DIVE_BASE_URL: ${{ vars.DEEP_DIVE_BASE_URL }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          if [ "$DRY" = "true" ]; then
            python -m daily_brief.main --dry-run -v
          else
            python -m daily_brief.main -v
          fi

      - name: Commit dedup state
        if: steps.dst.outputs.should_run == 'true'
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "daily-brief-bot@users.noreply.github.com"
          git add data/brief.db
          if git diff --cached --quiet; then
            echo "No DB changes to commit."
          else
            git commit -m "chore: update dedup state $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Upload Pages artifact
        if: steps.dst.outputs.should_run == 'true' && hashFiles('out/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    if: needs.build.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
