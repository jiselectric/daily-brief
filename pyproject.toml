[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-brief"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.3",
    "tenacity>=8.2.3",
    "python-dateutil>=2.9.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.1.0",
    "rapidfuzz>=3.6.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
daily_brief = ["deliver/templates/*.j2"]
